<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guide to Graduate School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: an "application file" — sticky tab bar, one view per tab, profiles as filed dossiers with the same fixed section order */
:root{
  --paper:#f5f7f9; --card:#ffffff; --ink:#132433; --muted:#566676; --line:#d9e1e8;
  --accent:#d1495b; --accent-ink:#ffffff; --teal:#0f6e74; --teal-soft:#e2f1f1;
  --full:#127a4a; --full-soft:#e3f4ea; --part:#9a5b00; --part-soft:#fbefd9;
  --warn-soft:#fdecee;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1820; --card:#16222c; --ink:#e6edf3; --muted:#9db0c0; --line:#2a3a47;
  --accent:#ff6b7d; --accent-ink:#1a0b0e; --teal:#5cc6c8; --teal-soft:#123336;
  --full:#5fd39a; --full-soft:#12301f; --part:#f2b55c; --part-soft:#33250f; --warn-soft:#3a1a20; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1820; --card:#16222c; --ink:#e6edf3; --muted:#9db0c0; --line:#2a3a47;
  --accent:#ff6b7d; --accent-ink:#1a0b0e; --teal:#5cc6c8; --teal-soft:#123336;
  --full:#5fd39a; --full-soft:#12301f; --part:#f2b55c; --part-soft:#33250f; --warn-soft:#3a1a20; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
a{color:var(--teal);text-underline-offset:2px}
a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);color:#fff}
header.top .wrap{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:18px;color:#fff;text-decoration:none;white-space:nowrap}
.brand span{color:#ff8a98}
nav.tabs{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin}
nav.tabs a{color:#cfdbe5;text-decoration:none;padding:6px 10px;border-radius:999px;font-size:15px;white-space:nowrap}
nav.tabs a[aria-current="page"]{background:#fff;color:#132433;font-weight:700}
nav.tabs a:hover{color:#fff}
main{padding-block:28px 64px}
.view{display:grid;gap:28px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lede{font-size:19px;max-width:65ch;color:var(--ink)}
p{max-width:70ch;margin:0}
.stack{display:grid;gap:12px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px}
.hero{display:grid;gap:14px;padding-block:8px 4px}
.hero h1{font-size:clamp(34px,6vw,58px);font-weight:800;letter-spacing:-.02em}
.hero h1 em{font-style:normal;color:var(--accent)}
.stat{display:grid;gap:2px}
.stat b{font-family:var(--f-display);font-size:30px}
.badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:12px;font-weight:600;letter-spacing:.06em;padding:4px 9px;border-radius:4px;border:1.5px solid currentColor;white-space:nowrap}
.badge.full{color:var(--full);background:var(--full-soft)}
.badge.part{color:var(--part);background:var(--part-soft)}
.note{background:var(--warn-soft);border-left:4px solid var(--accent);padding:12px 16px;border-radius:6px;max-width:none}
.note p{max-width:none}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-mono);font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.deadline{font-weight:700;color:var(--accent)}
/* profile */
.profile{scroll-margin-top:80px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.profile-head{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:0}
@media (max-width:760px){.profile-head{grid-template-columns:1fr}}
.profile-title{padding:22px;display:grid;gap:10px;align-content:start}
.profile-title h3{font-size:clamp(22px,3vw,28px)}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:15px;color:var(--muted)}
.photo{margin:0;background:repeating-linear-gradient(135deg,var(--teal-soft) 0 12px,transparent 12px 24px);border-left:1px solid var(--line);display:grid;place-items:center;min-height:180px;padding:16px;text-align:center}
.photo img{width:100%;height:100%;object-fit:cover}
.photo figcaption{font-size:13px;color:var(--muted)}
.ph{font-family:var(--f-mono);font-size:12px;color:var(--teal);font-weight:600}
.secs{display:grid;border-top:1px solid var(--line)}
details.sec{border-bottom:1px solid var(--line)}
details.sec>summary{cursor:pointer;list-style:none;padding:14px 22px;display:flex;justify-content:space-between;gap:12px;font-family:var(--f-display);font-weight:700;font-size:17px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"+";font-family:var(--f-mono);color:var(--muted)}
details.sec[open]>summary::after{content:"–"}
.sec-body{padding:0 22px 18px;display:grid;gap:10px}
.kv{display:grid;grid-template-columns:minmax(120px,210px) minmax(0,1fr);gap:6px 16px;font-size:16px}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0;min-width:0}
@media (max-width:520px){.kv{grid-template-columns:1fr}.kv dt{margin-top:6px}}
.st{font-family:var(--f-mono);font-size:11px;font-weight:600;padding:2px 7px;border-radius:3px;white-space:nowrap;display:inline-block}
.st.R{background:var(--accent);color:var(--accent-ink)}
.st.O{background:var(--teal-soft);color:var(--teal)}
.st.N{background:var(--full-soft);color:var(--full)}
.st.S{background:var(--part-soft);color:var(--part)}
.shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.shot{border:2px dashed var(--line);border-radius:8px;padding:16px;min-height:120px;display:grid;align-content:center;gap:6px;font-size:14px;color:var(--muted)}
.keyfacts{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:14px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
/* tier list */
.tier{display:grid;grid-template-columns:72px minmax(0,1fr);gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.tier-label{display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:34px;color:#fff}
.tS{background:#d1495b}.tA{background:#0f6e74}.tB{background:#3d5a80}.tC{background:#6b7785}
.tier-items{display:grid}
.rank{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:start;padding:14px 16px;border-bottom:1px solid var(--line)}
.rank:last-child{border-bottom:0}
.rank .n{font-family:var(--f-display);font-weight:800;font-size:26px;color:var(--muted)}
.rank h4{font-size:18px}
.score{font-family:var(--f-mono);font-size:20px;font-weight:600;text-align:right}
.score small{display:block;font-size:11px;color:var(--muted)}
.mini-photo{font-size:12px;color:var(--muted)}
@media (max-width:520px){.rank{grid-template-columns:32px minmax(0,1fr)}.score{grid-column:2;text-align:left}}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px;max-width:220px}
.bar i{display:block;height:100%;background:var(--teal)}
.copy{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:4px;padding:1px 6px;cursor:pointer;margin-left:6px}
footer{border-top:1px solid var(--line);padding-block:20px;color:var(--muted);font-size:14px}
ol.steps{margin:0;padding-left:22px;display:grid;gap:6px}
ul.clean{margin:0;padding-left:20px;display:grid;gap:4px}
@media (prefers-reduced-motion:no-preference){.view{animation:fade .25s ease}@keyframes fade{from{opacity:.4}to{opacity:1}}}
</style>
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>

const W = {fund:.35,fit:.30,access:.20,cost:.15};
P.forEach(p=>{p.total=Math.round((p.scores.fund*W.fund+p.scores.fit*W.fit+p.scores.access*W.access+p.scores.cost*W.cost)*100)/10});

start:()=>`<section class="view"><div class="hero"><div class="eyebrow">Start Here</div><h1>Words, checklist, and timeline</h1><p class="lede">Read this page once before you open the program profiles.</p></div>
 <div class="panel stack"><h2>Words to Know</h2><dl class="kv">

top10:()=>{
 const crit=[["Funding strength","35%","Full package or not, and how far the stipend goes in that city.","10 = full package with a stipend well above local basic costs; 5 = tuition cap not confirmed; 3 = stipend far below living costs.","Without money to live on, you cannot study. This is the main goal of the guide."],
 ["Course fit with IBSC","30%","How closely the courses continue IBSC subjects: PR, branding, campaigns, media, research.","10 = the program is strategic communication itself; 5 = related field with a few communication courses.","A good fit means your IBSC credits and experience count, and you grow your specialty."],
 ["Access for a 2027 graduate","20%","Can a senior apply now and qualify? Nationality limits, work experience, degree-in-hand rules, open deadlines.","10 = open to most nationalities, no work experience, deadline still ahead; 3 = most seniors cannot qualify this year.","A great scholarship is useless if you are not eligible yet."],
 ["Application cost and effort","15%","Fees, extra tests (GRE), and unusual requirements.","10 = low fee, no extra tests; 5 = GRE required or several extra steps.","Tests and fees cost money and time during your senior year."]];
 const tiers=["S","A","B","C"];
 const tierName={S:"Tier S · 85+",A:"Tier A · 75–84.9",B:"Tier B · 70–74.9",C:"Tier C · below 70"};
 let n=0;

 return `<section class="view"><div class="hero"><div class="eyebrow">Top 10 Tier List</div><h1>Our ranking</h1><p class="lede">We scored every program from 1 to 10 on four criteria, multiplied by the weights, and turned the result into a score out of 100. <b>Full Package programs always rank above Partly Funded programs</b>, even when a partly funded program scores higher.</p></div>

 <p class="note"><b>Method:</b> Score = (Funding × 0.35 + Fit × 0.30 + Access × 0.20 + Cost × 0.15) × 10. Ties are broken by Course fit. Funding gets the most weight because the guide is about studying without paying.</p>
 ${tierHTML}
 <div class="grid2"><div class="panel stack"><span class="eyebrow">Award</span><h2>🏅 Best for Funding</h2><p><b>NTU Singapore — Master of Communication Studies (Research).</b> It pays the highest stipend in this guide, SGD 2,900 a month (≈ NT$73,400), plus full tuition.</p></div>
 <div class="panel stack"><span class="eyebrow">Award</span><h2>🎓 Best for Education</h2><p><b>Lund University — MSc Strategic Communication.</b> It is strategic communication itself, taught by a department that specializes in the field, with internship and exchange options.</p></div></div>
 <div class="panel stack"><h2>Did not make the Top 10</h2><div class="scroll"><table><thead><tr><th>Program</th><th>Score</th><th>Why</th></tr></thead><tbody>
 ${out5.map(p=>{const why={euroculture:"Full package, but you must already hold your degree by 15 Jan 2027, so seniors can only apply for 2028; weaker communication fit.",chula:"Best course fit in Asia, but the scholarship does not pay the THB 107,000 faculty fee each semester, so it is only partly funded.",ncku:"Strong branding courses, but full tuition coverage above NT$40,000 per semester is not confirmed.",stust:"Design-focused and tuition coverage above the MOE cap is not confirmed.",corvinus:"Excellent course fit, but the HUF 43,700 stipend (≈ NT$4,400) does not cover living costs in Budapest."}[p.id];return `<tr><td><a href="#${p.region}" data-jump="p-${p.id}">${esc(p.prog.split(" (")[0].split(" — ")[0])}</a> ${badge(p.badge)}</td><td class="num">${p.total.toFixed(1)}</td><td>${why}</td></tr>`}).join("")}
 </tbody></table></div></div>
 <div class="panel stack"><h2>Score details</h2><div class="scroll"><table><thead><tr><th>Program</th><th>Funding ×0.35</th><th>Fit ×0.30</th><th>Access ×0.20</th><th>Cost ×0.15</th><th>Total</th></tr></thead><tbody>${ranked.map(p=>`<tr><td>${esc(p.prog.split(" (")[0].split(" — ")[0])}</td><td class="num">${p.scores.fund}</td><td class="num">${p.scores.fit}</td><td class="num">${p.scores.access}</td><td class="num">${p.scores.cost}</td><td class="num"><b>${p.total.toFixed(1)}</b></td></tr>`).join("")}</tbody></table></div><p>See the full comparison of all 15 programs on the <a href="#compare">Compare</a> page.</p></div></section>`},

const app=document.getElementById("app");
function render(){
  let h=(location.hash||"#home").slice(1); if(!V[h]) h="home";
  app.innerHTML=V[h]();
  document.querySelectorAll("nav.tabs a").forEach(a=>a.removeAttribute("aria-current"));
  document.querySelectorAll("nav.tabs a").forEach(a=>{if(a.getAttribute("href")==="#"+h)a.setAttribute("aria-current","page")});
  window.scrollTo(0,0);
}
document.addEventListener("click",e=>{
  const j=e.target.closest("[data-jump]"); if(!j) return;
  const target=j.getAttribute("data-jump"), href=j.getAttribute("href");
  const go=()=>{const el=document.getElementById(target); if(el){el.scrollIntoView({behavior:"smooth",block:"start"});}};
  if(href && href!==location.hash){e.preventDefault(); location.hash=href; setTimeout(go,60);} else {e.preventDefault(); go();}
});
window.addEventListener("hashchange",render);
render();
</script>
